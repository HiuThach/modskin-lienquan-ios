<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tải iOS - Liên Quân</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:#030711;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(0,174,255,.20),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(118,0,255,.15),
            transparent 30%
        ),
        #030711;
}


/* ================= BOX ================= */

.box{

    width:100%;
    max-width:460px;

    padding:32px 24px;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(20px);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 20px 70px rgba(0,0,0,.45);

    text-align:center;
}


/* ================= ICON ================= */

.icon{

    width:70px;
    height:70px;

    margin:0 auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    font-size:34px;

    background:rgba(0,180,255,.10);

    border:1px solid rgba(0,200,255,.25);

    box-shadow:
        0 0 30px rgba(0,190,255,.12);
}


/* ================= TITLE ================= */

h1{

    font-size:28px;

    margin-bottom:10px;

    background:
        linear-gradient(
            120deg,
            #ffffff,
            #9eeaff,
            #65d8ff
        );

    -webkit-background-clip:text;

    color:transparent;
}


/* ================= DESCRIPTION ================= */

.description{

    color:#8c9aaa;

    font-size:13px;

    line-height:1.6;

    margin-bottom:24px;
}


/* ================= INPUT ================= */

input{

    width:100%;

    height:52px;

    padding:0 16px;

    border-radius:13px;

    border:1px solid rgba(255,255,255,.15);

    outline:none;

    background:rgba(0,0,0,.35);

    color:white;

    text-align:center;

    font-size:15px;

    margin-bottom:12px;
}

input::placeholder{
    color:#667386;
}

input:focus{

    border-color:
        rgba(0,200,255,.7);

    box-shadow:
        0 0 20px
        rgba(0,190,255,.10);
}


/* ================= BUTTON ================= */

.btn{

    width:100%;

    height:52px;

    border:0;

    border-radius:13px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    font-size:14px;

    font-weight:800;

    letter-spacing:.8px;

    cursor:pointer;

    color:white;

    transition:.25s;
}


/* XÁC NHẬN */

.confirm{

    background:
        linear-gradient(
            100deg,
            #008cff,
            #00cfff
        );

    box-shadow:
        0 8px 30px
        rgba(0,170,255,.25);
}

.confirm:hover{

    transform:scale(1.02);

    filter:brightness(1.12);
}


/* ================= LOOTABLY ================= */

.offer{

    margin-top:12px;

    background:
        linear-gradient(
            100deg,
            #00a968,
            #00e887
        );

    box-shadow:
        0 8px 30px
        rgba(0,255,140,.18);
}

.offer:hover{

    transform:scale(1.02);

    filter:brightness(1.10);
}


/* ================= MESSAGE ================= */

#message{

    min-height:20px;

    margin-top:12px;

    font-size:12px;

    line-height:1.5;
}


/* ================= DOWNLOAD AREA ================= */

#downloadArea{

    display:none;

    margin-top:18px;

    padding:16px;

    border-radius:16px;

    background:rgba(0,0,0,.25);

    border:1px solid rgba(0,200,255,.20);
}

.download-title{

    font-size:13px;

    font-weight:800;

    color:#70ddff;

    margin-bottom:10px;
}


/* LINK */

.link-box{

    display:flex;

    gap:8px;

    width:100%;
}

#driveLink{

    flex:1;

    min-width:0;

    height:45px;

    padding:0 10px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(0,0,0,.35);

    color:#9eeaff;

    font-size:11px;

    outline:none;
}


/* COPY */

.copy-btn{

    width:80px;

    height:45px;

    border:0;

    border-radius:10px;

    background:
        linear-gradient(
            100deg,
            #008cff,
            #00cfff
        );

    color:white;

    font-size:11px;

    font-weight:800;

    cursor:pointer;
}

.copy-btn:active{

    transform:scale(.96);
}


/* ================= BACK ================= */

.back{

    display:block;

    margin-top:20px;

    color:#687789;

    text-decoration:none;

    font-size:12px;
}

.back:hover{

    color:#9aaabd;
}


/* ================= NOTE ================= */

.note{

    margin-top:20px;

    color:#4f5b6b;

    font-size:10px;

    line-height:1.5;
}


/* ================= MOBILE ================= */

@media(max-width:500px){

    body{
        padding:15px;
    }

    .box{

        padding:28px 18px;

        border-radius:21px;
    }

    h1{
        font-size:25px;
    }

    .description{
        font-size:12px;
    }

    #driveLink{
        font-size:10px;
    }

    .copy-btn{
        width:75px;
        font-size:10px;
    }

}

</style>

</head>


<body>


<div class="box">


    <!-- ICON -->

    <div class="icon">
        🍎
    </div>


    <!-- TITLE -->

    <h1>
        TẢI MOD iOS
    </h1>


    <!-- DESCRIPTION -->

    <p class="description">

        Nhập mã tải của bạn để tiếp tục.

    </p>


    <!-- INPUT -->

    <input
        id="code"
        type="text"
        placeholder="NHẬP MÃ TẢI"
        autocomplete="off"
    >


    <!-- CONFIRM -->

    <button
        class="btn confirm"
        onclick="checkCode()"
    >

        XÁC NHẬN MÃ

    </button>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- DOWNLOAD LINK -->

    <div id="downloadArea">

        <div class="download-title">

            ✅ MÃ HỢP LỆ — LINK TẢI

        </div>


        <div class="link-box">

            <input
                id="driveLink"
                type="text"
                value="https://drive.google.com/drive/folders/1jK2miINvCV6vr10BZu66KNyXV4J2PLRt?usp=sharing"
                readonly
            >


            <button
                class="copy-btn"
                onclick="copyLink()"
            >

                COPY

            </button>

        </div>

    </div>


    <!-- LOOTABLY -->

    <!--
        SAU KHI LOOTABLY DUYỆT:

        Thay LOOTABLY_LINK_HERE
        bằng link Offerwall thật của bạn.
    -->

    <a
        class="btn offer"
        href="LOOTABLY_LINK_HERE"
        target="_blank"
        rel="noopener noreferrer"
    >

        🎁 TÌM MÃ BẰNG CÁCH XEM QUẢNG CÁO

    </a>


    <!-- BACK -->

    <a
        class="back"
        href="index.html"
    >

        ← QUAY LẠI TRANG CHỦ

    </a>


    <!-- NOTE -->

    <div class="note">

        Hoàn thành nhiệm vụ hợp lệ để nhận mã tải.

    </div>


</div>


<script>


/* ==========================================
   LINK GOOGLE DRIVE
========================================== */

const driveURL =
"https://drive.google.com/drive/folders/1jK2miINvCV6vr10BZu66KNyXV4J2PLRt?usp=sharing";


/* ==========================================
   KIỂM TRA MÃ
========================================== */

function checkCode(){

    const input =
        document.getElementById("code");

    const message =
        document.getElementById("message");

    const downloadArea =
        document.getElementById("downloadArea");


    const code =
        input.value
        .trim()
        .toUpperCase();


    /* Không nhập mã */

    if(!code){

        message.style.color =
            "#ff9d9d";

        message.textContent =
            "Vui lòng nhập mã tải.";

        downloadArea.style.display =
            "none";

        return;
    }


    /*
    ==========================================
    MÃ DEMO

    Tạm thời mã:
    DEMO2026

    Sau này có hệ thống mã thật thì
    thay phần kiểm tra này.
    ==========================================
    */

    const demoCodes = [

        "DEMO2026"

    ];


    /* MÃ ĐÚNG */

    if(demoCodes.includes(code)){

        message.style.color =
            "#70ffba";

        message.textContent =
            "Mã hợp lệ! Link tải đã được mở.";


        /* Hiện khu vực link */

        downloadArea.style.display =
            "block";


        /* Đảm bảo link đúng */

        document.getElementById("driveLink").value =
            driveURL;


    }

    /* MÃ SAI */

    else{

        message.style.color =
            "#ff9d9d";

        message.textContent =
            "Mã không hợp lệ hoặc đã hết hạn.";

        downloadArea.style.display =
            "none";

    }

}


/* ==========================================
   COPY LINK
========================================== */

function copyLink(){

    const link =
        document.getElementById("driveLink").value;

    const button =
        document.querySelector(".copy-btn");


    navigator.clipboard.writeText(link)
    .then(function(){

        button.textContent =
            "ĐÃ COPY";

        setTimeout(function(){

            button.textContent =
                "COPY";

        },2000);

    })
    .catch(function(){

        /* Fallback cho trình duyệt không hỗ trợ */

        const input =
            document.getElementById("driveLink");

        input.select();

        document.execCommand("copy");

        button.textContent =
            "ĐÃ COPY";

        setTimeout(function(){

            button.textContent =
                "COPY";

        },2000);

    });

}

</script>


</body>

</html>

<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tải iOS - Liên Quân</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:#030711;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(0,174,255,.20),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(118,0,255,.15),
            transparent 30%
        ),
        #030711;
}


/* ================= BOX ================= */

.box{

    width:100%;
    max-width:460px;

    padding:32px 24px;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.025)
        );

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(20px);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 20px 70px rgba(0,0,0,.45);

    text-align:center;
}


/* ================= ICON ================= */

.icon{

    width:70px;
    height:70px;

    margin:0 auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    font-size:34px;

    background:rgba(0,180,255,.10);

    border:1px solid rgba(0,200,255,.25);

    box-shadow:
        0 0 30px rgba(0,190,255,.12);
}


/* ================= TITLE ================= */

h1{

    font-size:28px;

    margin-bottom:10px;

    background:
        linear-gradient(
            120deg,
            #ffffff,
            #9eeaff,
            #65d8ff
        );

    -webkit-background-clip:text;

    color:transparent;
}


/* ================= DESCRIPTION ================= */

.description{

    color:#8c9aaa;

    font-size:13px;

    line-height:1.6;

    margin-bottom:24px;
}


/* ================= DOWNLOAD AREA ================= */

.download-area{

    margin-top:10px;

    padding:18px;

    border-radius:16px;

    background:rgba(0,0,0,.25);

    border:1px solid rgba(0,200,255,.20);
}

.download-title{

    font-size:14px;

    font-weight:800;

    color:#70ddff;

    margin-bottom:12px;
}


/* ================= LINK BOX ================= */

.link-box{

    display:flex;

    gap:8px;

    width:100%;
}

#driveLink{

    flex:1;

    min-width:0;

    height:48px;

    padding:0 11px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(0,0,0,.35);

    color:#9eeaff;

    font-size:11px;

    outline:none;
}


/* ================= COPY BUTTON ================= */

.copy-btn{

    width:80px;

    height:48px;

    border:0;

    border-radius:10px;

    background:
        linear-gradient(
            100deg,
            #008cff,
            #00cfff
        );

    color:white;

    font-size:11px;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.copy-btn:hover{

    filter:brightness(1.12);

}

.copy-btn:active{

    transform:scale(.96);

}


/* ================= OPEN DRIVE ================= */

.open-drive{

    width:100%;

    height:50px;

    margin-top:12px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    color:white;

    font-size:13px;

    font-weight:800;

    letter-spacing:.5px;

    background:
        linear-gradient(
            100deg,
            #00a968,
            #00e887
        );

    box-shadow:
        0 8px 30px
        rgba(0,255,140,.18);

    transition:.2s;
}

.open-drive:hover{

    transform:scale(1.02);

    filter:brightness(1.1);

}


/* ================= BACK ================= */

.back{

    display:block;

    margin-top:20px;

    color:#687789;

    text-decoration:none;

    font-size:12px;
}

.back:hover{

    color:#9aaabd;
}


/* ================= NOTE ================= */

.note{

    margin-top:20px;

    color:#4f5b6b;

    font-size:10px;

    line-height:1.5;
}


/* ================= MOBILE ================= */

@media(max-width:500px){

    body{
        padding:15px;
    }

    .box{

        padding:28px 18px;

        border-radius:21px;
    }

    h1{
        font-size:25px;
    }

    .description{
        font-size:12px;
    }

    #driveLink{
        font-size:9px;
    }

    .copy-btn{
        width:75px;
        font-size:10px;
    }

}

</style>

</head>


<body>


<div class="box">


    <!-- ICON -->

    <div class="icon">
        🍎
    </div>


    <!-- TITLE -->

    <h1>
        TẢI MOD iOS
    </h1>


    <!-- DESCRIPTION -->

    <p class="description">

        Link tải dành cho iPhone và iPad.

    </p>


    <!-- ================= LINK TẢI ================= -->

    <div class="download-area">

        <div class="download-title">

            📥 LINK TẢI iOS

        </div>


        <div class="link-box">

            <input
                id="driveLink"
                type="text"
                value="https://drive.google.com/drive/folders/1jK2miINvCV6vr10BZu66KNyXV4J2PLRt?usp=sharing"
                readonly
            >


            <button
                class="copy-btn"
                onclick="copyLink()"
            >

                COPY

            </button>

        </div>


        <!-- MỞ GOOGLE DRIVE -->

        <a
            class="open-drive"
            href="https://drive.google.com/drive/folders/1jK2miINvCV6vr10BZu66KNyXV4J2PLRt?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
        >

            📂 MỞ GOOGLE DRIVE

        </a>

    </div>


    <!-- ================= BACK ================= -->

    <a
        class="back"
        href="index.html"
    >

        ← QUAY LẠI TRANG CHỦ

    </a>


    <div class="note">

        Nếu không mở được link, hãy bấm COPY và dán
        link vào trình duyệt.

    </div>


</div>


<script>

function copyLink(){

    const link =
        document.getElementById("driveLink").value;

    const button =
        document.querySelector(".copy-btn");


    navigator.clipboard.writeText(link)

    .then(function(){

        button.textContent =
            "ĐÃ COPY";

        setTimeout(function(){

            button.textContent =
                "COPY";

        },2000);

    })

    .catch(function(){

        const input =
            document.getElementById("driveLink");

        input.select();

        input.setSelectionRange(
            0,
            99999
        );

        document.execCommand("copy");

        button.textContent =
            "ĐÃ COPY";

        setTimeout(function(){

            button.textContent =
                "COPY";

        },2000);

    });

}

</script>


</body>

</html>
